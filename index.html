    <!-- Country Restriction Guard (IP Geolocation: strictly allows USA and Bangladesh, blocks all other countries) -->
    <script>
      (function() {
        var ALLOWED_COUNTRIES = ['US', 'BD'];
        var STORAGE_KEY = 'geo_country_code';

        function isCountryAllowed(code) {
          if (!code) return false;
          return ALLOWED_COUNTRIES.indexOf(code.toUpperCase().trim()) !== -1;
        }

        // Check preview or bypass parameter (e.g., ?preview=1 or ?bypass=1)
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('preview') || urlParams.has('bypass')) {
          try { sessionStorage.setItem('geo_bypass', 'true'); } catch (e) {}
        }
        try {
          if (sessionStorage.getItem('geo_bypass') === 'true') {
            return; // Allowed via developer/admin bypass
          }
        } catch (e) {}

        // Localhost development exclusion
        var hostname = window.location.hostname;
        if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '0.0.0.0') {
          return;
        }

        function showBlockedScreen() {
          window.__IS_GEO_BLOCKED__ = true;
          try {
            window.dispatchEvent(new CustomEvent('geo-blocked'));
          } catch (e) {}

          var blockHtml = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;text-align:center;padding:24px;">' +
            '<div style="max-width:520px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:48px 32px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05),0 2px 4px -2px rgba(0,0,0,0.05);">' +
            '<div style="width:52px;height:52px;margin:0 auto 20px;background-color:#fef2f2;border:1px solid #fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ef4444;">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg></div>' +
            '<h1 style="font-size:20px;font-weight:600;line-height:1.4;color:#1e293b;margin:0;">Access to this website is not available in your region.</h1>' +
            '</div></div>';

          if (document.body) {
            document.body.innerHTML = blockHtml;
          } else {
            document.addEventListener('DOMContentLoaded', function() {
              document.body.innerHTML = blockHtml;
            });
          }
        }

        try {
          var cached = sessionStorage.getItem(STORAGE_KEY);
          if (cached && !isCountryAllowed(cached)) {
            showBlockedScreen();
            return;
          }
        } catch (e) {}

        function checkCountryCode(code) {
          if (!code) return;
          code = code.toUpperCase().trim();
          try { sessionStorage.setItem(STORAGE_KEY, code); } catch (e) {}
          // Only USA and Bangladesh are permitted; all other countries are blocked
          if (!isCountryAllowed(code)) {
            showBlockedScreen();
          }
        }

        fetch('https://api.country.is/')
          .then(function(res) { return res.ok ? res.json() : Promise.reject(); })
          .then(function(data) {
            if (data && data.country) checkCountryCode(data.country);
          })
          .catch(function() {
            fetch('https://www.cloudflare.com/cdn-cgi/trace')
              .then(function(res) { return res.text(); })
              .then(function(text) {
                var match = text.match(/loc=([A-Z]{2})/i);
                if (match && match[1]) checkCountryCode(match[1]);
              })
              .catch(function() {
                fetch('https://ipwho.is/')
                  .then(function(res) { return res.json(); })
                  .then(function(data) {
                    if (data && data.country_code) checkCountryCode(data.country_code);
                  })
                  .catch(function() {});
              });
          });
      })();
    </script>
